<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">LogIn</title>
</head>
<body>
<section>

    <div class="container mt-3">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="my-card mt-3">
<!--                    mb-5 i added-->

                    <div th:if="${message}" th:classappend="${message.type}" class="alert" role="alert">
                        <p th:text="${message.content}"></p>
                    </div>
                    <div class="container text-center">
                        <img width="100px" src="" alt="" th:src="@{/images/login.avif}">
                    </div>

                    <h1 class="text-center">Log In!!</h1>

                    <form novalidate method="post" th:action="@{/check_credential}" th:object="${user}">

                        <div class="form-group">
                            <label for="email">Email address</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Enter email">
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" th:field="*{password}" id="password" placeholder="Enter Password">
                        </div>

                        <div class="container text-center">
                            <button type="submit" class="btn bg-primary text-white">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
