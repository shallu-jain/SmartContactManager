<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymleaf.org" th:replace="general/user_base::layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
</head>
<body>
<section>
    <div class="card">
        <div class="card-body">

            <table class="table">
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="row" th:text="'SCM_USER'+${user.id}">1</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <th scope="col">Name</th>
                    <td th:text="${user.name}"></td>
                </tr>
                <tr>
                    <th scope="col">Email</th>
                    <td th:text="${user.email}">7575</td>
                </tr>
                <tr>
                    <th scope="col">Role</th>
                    <td th:text="${user.role}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        $(document).ready(() => {
            $(".item").removeClass("active");
            $("#profile-link").addClass("active");
         });
    </script>
</section>
</body>
</html>
